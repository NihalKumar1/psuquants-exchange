<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSU Quants Exchange</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Join screen: shown until the server welcomes us. -->
<section id="join-screen" class="join">
  <div class="join-card">
    <div class="wordmark">PSU QUANTS <span>EXCHANGE</span></div>
    <p class="tagline">Trade or Tighten</p>
    <form id="join-form">
      <label>Name
        <input id="join-name" maxlength="20" autocomplete="off" placeholder="Your display name" required>
      </label>
      <label>Room code
        <input id="join-code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000" required>
      </label>
      <button type="submit" class="primary">Join the market</button>
      <p id="join-error" class="error"></p>
    </form>
  </div>
</section>

<!-- Trading screen. -->
<section id="trade-screen" hidden>
  <header class="topbar">
    <div class="wordmark">PSU QUANTS <span>EXCHANGE</span></div>
    <div class="me">
      <div class="stat"><small>Trader</small><b id="my-name"></b></div>
      <div class="stat"><small>Total PnL</small><b id="total-pnl"></b></div>
      <label class="stat click-size"><small>Click size</small>
        <input id="click-size" type="number" min="1" step="1">
      </label>
      <button id="cancel-all-everywhere" type="button" class="ghost">Cancel all (all markets)</button>
    </div>
  </header>
  <!-- Errors and notices: a red banner that floats over the page just under the top bar (it
       takes no space, so the book never moves). See showError and setNotice in trader.js. -->
  <div class="banner-anchor"><p id="banner" hidden></p></div>

  <main class="terminal">
    <!-- Left: one column per running market, side by side (oldest on the left). -->
    <div class="market-area">
      <p id="no-markets" class="panel waiting">No market is running. Wait for the instructor.</p>
      <div id="markets"></div>
    </div>

    <!-- Right: my resting orders, everyone's positions and the trade tape, for every market. -->
    <aside class="column">
      <section class="panel">
        <h2>Resting orders</h2>
        <table id="my-orders">
          <thead><tr><th>Market</th><th>Side</th><th class="num">Price</th><th class="num">Size</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>Positions</h2>
        <table id="positions">
          <thead></thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>Trades</h2>
        <div class="scroll">
          <table id="tape">
            <thead><tr><th>Time</th><th>Market</th><th>Buyer</th><th>Seller</th><th class="num">Price</th><th class="num">Size</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </aside>
  </main>
</section>

<!-- One market's column. trader.js makes a copy for each running market, so everything inside
     is found by class, not id. -->
<template id="market-column">
  <div class="market column">
    <!-- The order book comes first, so it sits at the same height in every column. -->
    <section class="panel book-panel">
      <div class="market-head">
        <span class="status pill"></span>
        <h1 class="title"></h1>
      </div>
      <p class="market-info muted"></p>
      <table class="book">
        <thead>
          <tr><th>Bidders</th><th class="num">Size</th><th class="price">Price</th><th class="num">Size</th><th class="right">Offerers</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Trade or Tighten: shown instead of order entry while the market is opening. -->
    <section class="tot-panel panel" hidden>
      <h2>Trade or Tighten</h2>

      <!-- 1. Width auction -->
      <div class="tot-auction">
        <p class="tot-line">Best width <b class="tot-best-width"></b> <span class="tot-best-holder muted"></span></p>
        <form class="width-form entry single">
          <input class="width-input" type="number" min="0" placeholder="Your width">
          <button type="submit" class="primary">Submit width</button>
        </form>
        <p class="hint">The narrowest width makes the market. Width is in price units and must beat the best.</p>
      </div>

      <!-- 2 and 3. The market maker and their quote -->
      <p class="tot-mm-line tot-line"></p>
      <form class="mm-quote-form entry quote">
        <input class="mm-bid" type="number" placeholder="Bid">
        <input class="mm-ask" type="number" placeholder="Offer">
        <button type="submit" class="primary">Submit quote (final)</button>
      </form>

      <!-- 3. The forced trade -->
      <div class="tot-forced">
        <p class="tot-line">Time left <b data-countdown=""></b>  ·  Size <b class="tot-size"></b></p>
        <div class="forced-buttons">
          <button type="button" class="choose-buy buy">Buy at <span class="forced-ask"></span></button>
          <button type="button" class="choose-sell sell">Sell at <span class="forced-bid"></span></button>
        </div>
        <p class="forced-note hint"></p>
      </div>
    </section>

    <section class="entry-panel panel">
      <h2>Order entry</h2>
      <form class="buy-form entry">
        <input class="buy-price" type="number" placeholder="Bid price">
        <input class="buy-size" type="number" min="1" step="1" placeholder="Size">
        <button type="submit" class="buy">Bid</button>
      </form>
      <form class="sell-form entry">
        <input class="sell-price" type="number" placeholder="Offer price">
        <input class="sell-size" type="number" min="1" step="1" placeholder="Size">
        <button type="submit" class="sell">Offer</button>
      </form>
      <h3>Two-sided quote</h3>
      <form class="quote-form entry quote">
        <input class="quote-bid" type="number" placeholder="Bid">
        <input class="quote-ask" type="number" placeholder="Offer">
        <input class="quote-size" type="number" min="1" step="1" placeholder="Size">
        <button type="submit" class="primary">Quote</button>
      </form>
    </section>

    <section class="panel">
      <h2>My numbers</h2>
      <div class="tiles">
        <div class="tile"><small>Position</small><b class="my-position"></b></div>
        <div class="tile"><small>Realized</small><b class="my-realized"></b></div>
        <div class="tile"><small>MTM</small><b class="my-unrealized"></b></div>
        <div class="tile"><small>Total</small><b class="my-total"></b></div>
      </div>
      <div class="cancel-all">
        <button type="button" class="cancel-all-market ghost">Cancel all (this market)</button>
      </div>
    </section>
  </div>
</template>

<script src="/static/common.js"></script>
<script src="/static/trader.js"></script>
</body>
</html>
