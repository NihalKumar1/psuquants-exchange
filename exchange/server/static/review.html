<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review · PSU Quants Exchange</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Login screen: the admin password (remembered, shared with the admin page). -->
<section id="login-screen" class="join">
  <div class="join-card">
    <div class="wordmark">PSU QUANTS <span>EXCHANGE</span></div>
    <p class="tagline">Review screen</p>
    <form id="login-form" class="stack-form">
      <label>Admin secret
        <input id="login-secret" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary">Log in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>
</section>

<!-- Review screen, for the projector: one trader's trades in one market, or the leaderboard
     (the Review | Leaderboard switch, SPEC Q156). -->
<section id="review-screen" hidden>
  <header class="topbar">
    <div class="wordmark">PSU QUANTS <span>EXCHANGE</span> · REVIEW</div>
    <div class="toggle view-switch" id="view-switch">
      <button type="button" data-view="review">Review</button>
      <button type="button" data-view="leaderboard">Leaderboard</button>
    </div>
    <label class="picker review-only"><small>Market</small><select id="pick-market"></select></label>
    <label class="picker review-only"><small>Trader</small><select id="pick-trader"></select></label>
    <span id="market-status" class="pill review-only" hidden></span>
    <div class="me">
      <div class="stat review-only" id="settled-stat" hidden><small>Settled at</small><b id="settled-value"></b></div>
      <button id="log-out" type="button" class="ghost">Log out</button>
    </div>
  </header>
  <p id="message"></p>

  <main class="review review-only">
    <section class="panel">
      <div class="chart-head">
        <h2 id="chart-heading">Price</h2>
        <div class="legend">
          <span><i class="key mark"></i>Mark</span>
          <span><i class="key last"></i>Last price</span>
          <span><b class="up">▲</b> Buy</span>
          <span><b class="down">▼</b> Sell</span>
          <span><i class="key drop"></i>Info drop</span>
          <span><i class="key settle"></i>Settlement</span>
          <!-- Only for a market in a delta-hedging round (SPEC Q177). -->
          <span class="round-key"><i class="key fair"></i>Fair value</span>
          <span class="round-key"><i class="key delta"></i>Net delta (right axis)</span>
        </div>
        <!-- The price axis range: blank fits the prices on the chart (SPEC Q128). -->
        <div class="chart-range">
          <label>Min <input id="chart-min" type="number" step="any" placeholder="auto"></label>
          <label>Max <input id="chart-max" type="number" step="any" placeholder="auto"></label>
        </div>
      </div>
      <div id="chart"></div>
    </section>

    <section class="panel">
      <h2 id="fills-heading">Trades</h2>
      <div class="scroll-x">
        <table id="fills">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Everyone ranked by equity (renderLeaderboard in review.js). -->
  <main class="review leaderboard-only">
    <section class="panel">
      <h2>Leaderboard</h2>
      <div class="scroll-x">
        <table id="leaderboard">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</section>

<script src="/static/common.js"></script>
<script src="/static/review.js"></script>
</body>
</html>
